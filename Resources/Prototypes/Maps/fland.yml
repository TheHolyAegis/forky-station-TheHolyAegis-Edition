- type: gameMap
  id: Fland
  mapName: 'Fland Installation'
  mapPath: /Maps/_Funkystation/fland.yml
  minPlayers: 60
  # maxPlayers: 90 # disabled to make it 55+
  stations:
    Fland:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Fland Installation {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'B'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Funkystation/Shuttles/emergency_fland.yml
        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_fland.yml
        - type: StationJobs
          availableJobs:
            # Command
            Captain: [ 1, 1 ]
            CorporateLiaison: [ 1, 1 ]
            # Internal Affairs
            InternalAffairsAgent: [ 2, 2 ]
            Magistrate: [ 1, 1 ]
            # Service
            HospitalityDirector: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Janitor: [ 3, 3 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
#            Boxer: [ 4, 4 ] - Disabled due to no prototype
#            Zookeeper: [ 1, 1 ] - Disabled due to no boxer prototype
            # Engineering
            ChiefEngineer: [ 1, 1 ]
            StationEngineer: [ 8, 8 ]
            TechnicalAssistant: [ 4, 4 ]
            # Medical
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 3, 3 ]
            MedicalDoctor: [ 6, 6 ]
            Paramedic: [ 2, 2 ]
#            Psychologist: [ 1, 1 ] - Disabled due to no prototype
            MedicalIntern: [ 4, 4 ]
            # Science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 5, 5 ]
            Roboticist: [ 1, 1 ]
            ResearchAssistant: [ 6, 6 ]
            # Security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 8, 8 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 4, 4 ]
            Lawyer: [ 2, 2 ]
            # Logistics
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 3, 3 ]
            CargoTechnician: [ 4, 4 ]
            Botanist: [ 3, 3 ]
            # Civilian
            Passenger: [ -1, -1 ]
            #silicon
#            StationAi: [ 1, 1 ] - dead
            Borg: [ 4, 4 ]
